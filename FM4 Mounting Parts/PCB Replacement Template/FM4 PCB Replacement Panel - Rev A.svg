<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- FM4 PCB replacement panel, Rev A. Units: mm. Cut paths only. -->
<svg xmlns="http://www.w3.org/2000/svg" width="296mm" height="173.5mm" viewBox="0 0 296 173.5">
  <title>FM4 PCB Replacement Panel — Rev A</title>
  <desc>Photo-derived, 1:1 laser-cut template. Confirm on card before cutting material.</desc>
  <g id="CUT_3P5MM" fill="none" stroke="#ff0000" stroke-width="0.1">
    <rect x="0" y="0" width="296" height="173.5"/>
    <!-- Existing 3.5 mm screw/fixing holes, clockwise from the top-left -->
    <circle cx="8" cy="159.5" r="1.75"/><circle cx="8" cy="40.5" r="1.75"/>
    <circle cx="49" cy="39.5" r="1.75"/><circle cx="74" cy="25.5" r="1.75"/>
    <circle cx="126" cy="80.5" r="1.75"/><circle cx="126" cy="28.5" r="1.75"/>
    <circle cx="126" cy="13.5" r="1.75"/><circle cx="182" cy="80.5" r="1.75"/>
    <circle cx="182" cy="25.5" r="1.75"/><circle cx="195" cy="11.5" r="1.75"/>
    <circle cx="292" cy="158.5" r="1.75"/><circle cx="292" cy="27.5" r="1.75"/>
  </g>
  <g id="CUT_3MM" fill="none" stroke="#00aa00" stroke-width="0.1">
    <!-- Five larger pads in the lower connector group: 3 mm -->
    <circle cx="270" cy="129.5" r="1.5"/><circle cx="274" cy="129.5" r="1.5"/>
    <circle cx="278" cy="129.5" r="1.5"/><circle cx="272" cy="125.5" r="1.5"/>
    <circle cx="276" cy="125.5" r="1.5"/>
  </g>
  <g id="CUT_2MM" fill="none" stroke="#0000ff" stroke-width="0.1">
    <!-- Four small silver pins: 2 mm -->
    <circle cx="126" cy="168.0" r="1.0"/><circle cx="129" cy="168.0" r="1.0"/>
    <circle cx="126" cy="164.5" r="1.0"/><circle cx="129" cy="164.5" r="1.0"/>
    <!-- Silver pin holes beside the five-pad connector group: 2 mm -->
    <circle cx="269" cy="120.5" r="1.0"/><circle cx="273" cy="120.5" r="1.0"/>
    <circle cx="277" cy="120.5" r="1.0"/><circle cx="271" cy="116.8" r="1.0"/>
    <circle cx="275" cy="116.8" r="1.0"/>
  </g>
  <!-- Red = 3.5 mm, green = 3 mm, blue = 2 mm. Disable engraving/raster operations. -->
</svg>
